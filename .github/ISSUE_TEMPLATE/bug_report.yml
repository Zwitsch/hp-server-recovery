name: Bug report / Fehlerbericht
description: Report a reproducible problem in the recovery framework / Reproduzierbares Problem im Recovery-Framework melden
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve HP Server Recovery. Do not include secrets, production manifests, backups, device identifiers, private network details, or unredacted logs.
        Danke für die Unterstützung bei der Verbesserung von HP Server Recovery. Keine Secrets, produktiven Manifeste, Backups, Gerätekennungen, privaten Netzwerkdetails oder unbereinigten Logs veröffentlichen.
  - type: textarea
    id: summary
    attributes:
      label: Summary / Zusammenfassung
      description: What happened? / Was ist passiert?
      placeholder: Describe the problem without private data. / Problem ohne private Daten beschreiben.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / Schritte zur Reproduktion
      description: Use synthetic or sanitized inputs only. / Nur synthetische oder bereinigte Eingaben verwenden.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit / Version oder Commit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected fail-closed behavior / Erwartetes Fail-Closed-Verhalten
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / Bereinigte Nachweise
      description: Remove secrets, hostnames, paths, UUIDs, IP addresses, domains, and backup data. / Secrets, Hostnamen, Pfade, UUIDs, IP-Adressen, Domains und Backup-Daten entfernen.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation / Sicherheitsbestätigung
      options:
        - label: I removed secrets and production-specific identifiers. / Ich habe Secrets und produktionsspezifische Kennungen entfernt.
          required: true
        - label: I did not attach backups, database dumps, .env files, or private manifests. / Ich habe keine Backups, Datenbank-Dumps, .env-Dateien oder privaten Manifeste angehängt.
          required: true
