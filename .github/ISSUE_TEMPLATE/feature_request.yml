name: Feature request
description: Suggest a generic, fail-closed improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Proposals must remain generic and sanitized. Do not include production manifests, backups, secrets, private infrastructure details, or real device identifiers.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What generic recovery problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior using synthetic examples.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Explain how the proposal preserves or strengthens fail-closed behavior.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Publication confirmation
      options:
        - label: This request contains only generic or synthetic information.
          required: true
        - label: I removed secrets and production-specific identifiers.
          required: true
