name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Compile Python sources
        run: python -m compileall -q lib tests

      - name: Run recovery test suites
        run: python -m unittest tests.test_t01_t35 tests.test_wizard_v028 tests.test_realtest_mode
